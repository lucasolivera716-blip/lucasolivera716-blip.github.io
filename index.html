<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>5/3/1</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{
  --bg:#0a0a0a; --bg-elevated:#161614; --bg-card:#1c1c19;
  --accent:#ff5a1f;
  --deload:#2fb8c6; --deload-dim:#123a3e;
  --text:#f5f5f0; --text-dim:#8a8a85; --border:#2c2c28;
  --done:#3ddc84; --done-dim:#173325; --danger:#ff3b30;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; min-height:100dvh;
  padding-bottom:76px;
}
h1,h2,h3{margin:0; letter-spacing:-0.01em;}
button{font-family:inherit;}
.hidden{display:none !important;}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 8px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg);z-index:5;
}
.topbar .brand{font-weight:800;font-size:1.1rem;letter-spacing:-0.02em;}
.topbar .brand .accent{color:var(--accent);}
.pill{
  font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;
  text-transform:uppercase;letter-spacing:.04em;
}
.pill-deload{background:var(--deload-dim);color:var(--deload);}
.pill-optional{background:var(--bg-card);color:var(--text-dim);border:1px solid var(--border);}
.card{
  background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
  padding:18px; margin-bottom:14px;
}
.btn{
  display:block; width:100%; text-align:center; border:none; border-radius:12px;
  padding:18px 16px; font-size:1.05rem; font-weight:700; color:var(--text);
  background:var(--bg-elevated); border:1px solid var(--border); cursor:pointer;
  min-height:56px;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent); color:#140700; border-color:var(--accent);}
.btn-ghost{background:transparent;}
.btn-danger{color:var(--danger); border-color:var(--danger);}
.btn-sm{padding:10px 14px; font-size:.85rem; min-height:40px; width:auto;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
.muted{color:var(--text-dim);}
.section-title{font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); font-weight:700; margin:22px 0 10px;}

/* Inicio */
.inicio-status{ text-align:center; padding:20px 4px 6px; }
.inicio-week{ font-size:1.05rem; color:var(--text-dim); font-weight:600; }
.inicio-day{ font-size:2rem; font-weight:800; margin:6px 0 2px; letter-spacing:-0.02em; }
.deload-banner{
  background:var(--deload-dim); border:1px solid var(--deload); color:var(--deload);
  border-radius:12px; padding:14px; text-align:center; font-weight:700; margin-bottom:16px;
}
/* Selector de semana + progreso */
.week-nav{ display:flex; align-items:center; justify-content:center; gap:18px; padding:10px 0 4px; }
.week-nav button{
  background:var(--bg-card); border:1px solid var(--border); color:var(--text);
  width:44px; height:44px; border-radius:12px; font-size:1.3rem; font-weight:700; cursor:pointer;
}
.week-nav button:disabled{ opacity:.3; }
.week-nav .week-nav-label{ text-align:center; min-width:170px; }
.week-nav .week-nav-n{ font-size:1.3rem; font-weight:800; }
.week-nav .week-nav-scheme{ font-size:.85rem; color:var(--text-dim); font-weight:600; }
.progress-dots{ display:flex; justify-content:center; gap:10px; margin:14px 0 20px; }
.progress-dots .dot{
  width:34px; height:8px; border-radius:99px; background:var(--bg-card); border:1px solid var(--border);
}
.progress-dots .dot.current{ border-color:var(--accent); }
.progress-dots .dot.done{ background:var(--done); border-color:var(--done); }
.progress-dots .dot.deload.done{ background:var(--deload); border-color:var(--deload); }

/* Tiles cuadrados de elección de día / grupo muscular */
.lift-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:6px; }
.lift-tile{
  position:relative; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; background:var(--bg-card); border:1px solid var(--border); border-radius:16px;
  color:var(--accent); cursor:pointer; padding:10px; text-align:center;
}
.lift-tile:active{ transform:scale(0.97); }
.lift-tile.done{ color:var(--done); border-color:var(--done); }
.lift-tile-icon{ line-height:0; }
.lift-tile-name{ color:var(--text); font-size:.95rem; font-weight:800; }
.lift-tile-meta{ color:var(--text-dim); font-size:.75rem; font-weight:600; }
.lift-tile-check{ position:absolute; top:8px; right:10px; font-size:1.1rem; font-weight:800; color:var(--done); }
.io-caption{ font-size:.8rem; color:var(--text-dim); margin-top:8px; line-height:1.4; }

/* Sesion sets */
.set-card{
  background:var(--bg-card); border:1px solid var(--border); border-radius:16px;
  padding:16px; margin-bottom:12px; position:relative;
}
.set-card.done{ opacity:.55; border-color:var(--done); }
.set-card .set-label{ font-size:.78rem; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
.set-weight{
  font-size:clamp(3rem,15vw,4.4rem); font-weight:800; line-height:1; letter-spacing:-0.03em;
  margin:6px 0 2px;
}
.set-weight .unit{ font-size:1.3rem; font-weight:700; color:var(--text-dim); margin-left:6px; }
.set-reps{ font-size:1.1rem; color:var(--text-dim); font-weight:600; margin-bottom:8px; }
.set-plates{ font-size:1rem; margin-bottom:12px; }
.set-plates .lbl{ color:var(--text-dim); font-size:.8rem; display:block; margin-bottom:2px;}
.set-plates .val{ font-weight:700; }
.set-plates .val.error{ color:var(--danger); }
.check-btn{
  width:100%; padding:16px; border-radius:12px; border:2px solid var(--border);
  background:var(--bg-elevated); color:var(--text); font-weight:800; font-size:1rem;
  cursor:pointer; min-height:56px;
}
.check-btn.checked{ background:var(--done-dim); border-color:var(--done); color:var(--done); }
.amrap-inputs{ display:flex; gap:10px; margin-top:10px; }
.amrap-inputs label{ flex:1; display:flex; flex-direction:column; font-size:.75rem; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:.04em; gap:6px;}
.amrap-inputs input{
  background:var(--bg-elevated); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:12px; font-size:1.1rem; font-weight:700; width:100%;
}
.timer-clock{
  background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-dim);
  border-radius:10px; padding:8px 12px; font-size:.85rem; font-weight:700; cursor:pointer;
}

/* Rest timer bar */
.rest-bar{
  position:fixed; left:0; right:0; bottom:76px; z-index:20;
  background:var(--accent); color:#140700; padding:14px 18px;
  display:flex; align-items:center; justify-content:space-between;
  font-weight:800; font-size:1.3rem;
}
.rest-bar .rest-skip{ background:rgba(0,0,0,.2); border:none; color:#140700; font-weight:800; padding:8px 14px; border-radius:8px; font-size:.9rem; cursor:pointer; }
body.rest-active{ padding-bottom:150px; }

/* Assistance */
details.assist{ border:1px solid var(--border); border-radius:12px; padding:2px 14px; margin-top:6px; }
details.assist summary{ padding:12px 0; font-weight:700; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center;}
details.assist summary::-webkit-details-marker{display:none;}
details.assist summary::after{ content:"+"; font-size:1.4rem; color:var(--text-dim); }
details.assist[open] summary::after{ content:"–"; }
.assist-item{ padding:12px 0; border-top:1px solid var(--border); }
.assist-item .a-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.assist-item .a-name{ font-weight:700; }
.assist-item .a-sets{ color:var(--accent); font-weight:700; white-space:nowrap; }
.assist-item .a-notes{ color:var(--text-dim); font-size:.88rem; margin-top:4px; }
.assist-item .a-timer{ margin-top:8px; }

textarea.note{
  width:100%; background:var(--bg-card); border:1px solid var(--border); color:var(--text);
  border-radius:12px; padding:12px; font-size:1rem; min-height:70px; font-family:inherit; resize:vertical;
}

/* Historial */
.tabbar{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; }
.tab{ flex:0 0 auto; padding:10px 16px; border-radius:99px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-dim); font-weight:700; cursor:pointer; }
.tab.active{ background:var(--accent); color:#140700; border-color:var(--accent); }
.hist-row{ border-bottom:1px solid var(--border); padding:14px 0; }
.hist-row:last-child{ border-bottom:none; }
.hist-top{ display:flex; justify-content:space-between; font-weight:700; }
.hist-week{ color:var(--text-dim); font-weight:600; font-size:.85rem; }
.hist-sets{ margin-top:6px; font-size:.95rem; }
.hist-amrap{ color:var(--accent); font-weight:700; }
.hist-note{ margin-top:6px; font-size:.88rem; color:var(--text-dim); font-style:italic; }
.empty{ text-align:center; color:var(--text-dim); padding:40px 10px; }

/* Cierre de ciclo — lista compacta */
.cierre-row{ border-bottom:1px solid var(--border); padding:14px 0; }
.cierre-row:last-child{ border-bottom:none; }
.cierre-row-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.cierre-name{ font-size:1.05rem; font-weight:800; }
.cierre-badge{ font-size:.72rem; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
.cierre-sugerencias{ margin-top:6px; font-size:.92rem; color:var(--text); }
.cierre-sugerencias b{ color:var(--text); }

/* Nuevo bloque */
.tm-input-row{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.tm-input-label{ font-size:.85rem; font-weight:700; }
.tm-input-row input{
  background:var(--bg-card); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:14px; font-size:1.3rem; font-weight:800; width:100%;
}
.tm-input-hint{ font-size:.78rem; color:var(--text-dim); }

/* Bottom nav */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--bg-elevated);
  border-top:1px solid var(--border); z-index:15; padding-bottom:env(safe-area-inset-bottom);
}
.bottomnav button{
  flex:1; background:none; border:none; color:var(--text-dim); font-weight:700; font-size:.8rem;
  padding:14px 4px; cursor:pointer;
}
.bottomnav button.active{ color:var(--accent); }

.fatal{
  position:fixed; inset:0; background:#2a0500; color:#fff; padding:24px; z-index:999;
  font-family:monospace; font-size:.95rem; overflow:auto; white-space:pre-wrap;
}

.io-row{ display:flex; gap:10px; margin-top:18px; }
.io-row button{ font-size:.85rem; }
</style>
</head>
<body>

<div id="fatal" class="fatal hidden"></div>

<div class="topbar">
  <div class="brand">5<span class="accent">/</span>3<span class="accent">/</span>1</div>
  <div id="topbar-tag" class="pill pill-optional">Semana –/8</div>
</div>

<!-- INICIO -->
<div id="screen-inicio" class="screen wrap"></div>

<!-- SESION -->
<div id="screen-sesion" class="screen wrap hidden"></div>

<!-- HISTORIAL -->
<div id="screen-historial" class="screen wrap hidden"></div>

<!-- CIERRE -->
<div id="screen-cierre" class="screen wrap hidden"></div>

<!-- NUEVO BLOQUE -->
<div id="screen-bloque" class="screen wrap hidden"></div>

<div id="rest-bar-slot"></div>

<nav class="bottomnav">
  <button id="nav-inicio" data-screen="inicio">Inicio</button>
  <button id="nav-historial" data-screen="historial">Historial</button>
</nav>

<script>
"use strict";

/* =========================================================================
   CONFIGURACIÓN — único punto de verdad. Cambiar los TM y todo se recalcula.
   ========================================================================= */
const CONFIG = {

  // Múltiplo de redondeo para todos los pesos calculados (kg).
  roundingIncrement: 2.5,

  // Barra y discos disponibles POR LADO. Cantidad ilimitada por disco
  // (gimnasio comercial estándar) — el cálculo de carga usa greedy.
  barWeight: 20,
  availablePlates: [25, 20, 15, 10, 5, 2.5, 1.25],

  // Training Max vigente de cada levantamiento (el de este bloque, no el
  // 90% del 1RM histórico). "category" define qué incremento de cierre de
  // ciclo le corresponde (lower vs upper body).
  lifts: {
    squat:    { label: "Back Squat",    tm: 102.5, category: "lower", optional: false },
    bench:    { label: "Press Banca",   tm: 92.5,  category: "upper", optional: false },
    deadlift: { label: "Peso Muerto",   tm: 137.5, category: "lower", optional: false },
    ohp:      { label: "Press Militar", tm: 47.5,  category: "upper", optional: true  }
  },

  // Orden de visualización de los levantamientos. No fuerza secuencia: el
  // usuario elige libremente qué día entrenar dentro de la semana activa.
  dayOrder: ["squat", "bench", "deadlift", "ohp"],

  // Esquema semanal — plantilla reutilizada por todos los bloques (los TM y
  // la numeración sí cambian por bloque, ver "Nuevo bloque" en el código).
  // El bloque en curso conserva su numeración real 5–8 (NO se renumera a
  // 1–4). pcts / reps van en paralelo a las 3 series de trabajo.
  // amrap:false ⇒ ninguna serie de esa semana es AMRAP (deload).
  weeks: [
    { n: 5, label: "5/5/5+",  pcts: [65, 75, 85], reps: [5, 5, 5], amrap: true,  deload: false },
    { n: 6, label: "3/3/3+",  pcts: [70, 80, 90], reps: [3, 3, 3], amrap: true,  deload: false },
    { n: 7, label: "5/3/1+",  pcts: [75, 85, 95], reps: [5, 3, 1], amrap: true,  deload: false },
    { n: 8, label: "Deload",  pcts: [40, 50, 60], reps: [5, 5, 5], amrap: false, deload: true  }
  ],

  // Timer de descanso, en segundos.
  restTimer: { main: 180, assistance: 90 },

  // Ejercicios de asistencia por día (clave = dayOrder). Colapsados por
  // defecto en la pantalla de Sesión.
  assistance: {
    squat: [
      { name: "Box Jump (cajón)", sets: 3, reps: "3", notes: "ANTES del Squat principal. Explosivo, aterrizaje suave. Activación neural." },
      { name: "Front Squat o Squat Pausa", sets: 3, reps: "8", notes: "60-65% del TM de squat. Profundidad total, pausa 1s abajo." },
      { name: "Hip Thrust con barra", sets: 3, reps: "10", notes: "Glúteo. Pausa 1s arriba, contracción máxima." },
      { name: "Walking Lunges con mancuernas", sets: 3, reps: "12 pasos", notes: "Control. Rodilla alineada con el pie." },
      { name: "Pallof Press", sets: 3, reps: "12 c/lado", notes: "Anti-rotación. Cierre de core." }
    ],
    bench: [
      { name: "Remo Pendlay", sets: 4, reps: "6", notes: "Explosivo hacia el ombligo. Tronco paralelo al piso. Empezá con 50-60kg." },
      { name: "Press Inclinado con mancuernas", sets: 3, reps: "10", notes: "Hombro alto, pecho. Agarre neutro si sentís hombro." },
      { name: "Remo con mancuerna a un brazo", sets: 3, reps: "10 c/brazo", notes: "Apoyo en banco, estira el dorsal abajo." },
      { name: "Face Pulls", sets: 3, reps: "15", notes: "Banda media. Salud de hombro, mantenelo." },
      { name: "Tríceps (paralelas asistidas o press francés)", sets: 3, reps: "12", notes: "Lo que tengas disponible." }
    ],
    deadlift: [
      { name: "Peso Muerto Rumano", sets: 3, reps: "8", notes: "60% del TM de peso muerto. Lento abajo, isquios estirados." },
      { name: "Bulgarian Split Squat", sets: 3, reps: "8 c/pierna", notes: "Pie trasero elevado. Control motor, sin colapso de rodilla." },
      { name: "Pull-ups o jalón", sets: 3, reps: "8", notes: "Si dominadas con peso corporal: 3 x al fallo -2. Si no: jalón al pecho." },
      { name: "Farmer Carry", sets: 4, reps: "30m", notes: "Pesado pero estable. Postura, agarre, core." },
      { name: "Hanging Leg Raises o Dead Bug", sets: 3, reps: "10", notes: "Core anti-extensión." }
    ],
    ohp: [
      { name: "Dominadas (con o sin peso)", sets: 5, reps: "al fallo -1", notes: "Si peso corporal es fácil, agregás peso. Volumen total de tirones verticales." },
      { name: "Press con mancuernas sentado", sets: 3, reps: "10", notes: "Apoyo de respaldo. Suma volumen de hombro." },
      { name: "Elevaciones laterales", sets: 3, reps: "15", notes: "Hombro lateral, peso ligero, control." },
      { name: "Curl bíceps barra", sets: 3, reps: "10", notes: "Para los brazos. Y porque se siente bien." },
      { name: "Plancha frontal", sets: 3, reps: "45-60s", notes: "Core estático, cierre." }
    ]
  },

  // Cierre de ciclo: reglas según reps del AMRAP de la semana fuerte
  // (5/3/1+, mínimo prescrito: 1) de cualquier bloque. deltaLower/deltaUpper
  // se suman al TM según category. La regla "recalcular" usa la fórmula
  // literal del e1RM, ver lógica.
  cierreDeCiclo: {
    reglas: [
      { repsMin: 1, repsMax: 1,        lectura: "TM al límite",  accion: "mantener_o_bajar", delta: -2.5 },
      { repsMin: 2, repsMax: 3,        lectura: "TM correcto",   accion: "sumar", deltaLower: 5,   deltaUpper: 2.5 },
      { repsMin: 4, repsMax: 6,        lectura: "TM bajo",       accion: "sumar", deltaLower: 7.5, deltaUpper: 5   },
      { repsMin: 7, repsMax: Infinity, lectura: "TM muy bajo",   accion: "recalcular" }
    ]
  }
};

/* =========================================================================
   REDONDEO — empate al par (banker's rounding), múltiplos de 2.5 kg.
   ========================================================================= */
function redondear(peso) {
  const inc = CONFIG.roundingIncrement;
  const q = Math.round((peso / inc) * 1e6) / 1e6; // matar ruido de float
  const f = Math.floor(q);
  const d = q - f;
  let n;
  if (d > 0.5) n = f + 1;
  else if (d < 0.5) n = f;
  else n = (f % 2 === 0) ? f : f + 1; // empate → al par
  return n * inc;
}

function calcularPesoSerie(tm, pct) {
  return redondear(tm * pct / 100);
}

/* =========================================================================
   DISCOS — cuántos poner por lado (greedy, cantidad ilimitada por disco).
   ========================================================================= */
function calcularDiscos(pesoTotal) {
  const porLado = (pesoTotal - CONFIG.barWeight) / 2;
  if (porLado < -1e-6) return { ok: false, reason: "menor_a_barra" };
  if (Math.abs(porLado) < 1e-6) return { ok: true, plates: [] };

  let restante = Math.round(porLado * 1e6) / 1e6;
  const plates = [];
  const sorted = [...CONFIG.availablePlates].sort((a, b) => b - a);
  for (const p of sorted) {
    let count = 0;
    while (restante - p >= -1e-6) {
      restante = Math.round((restante - p) * 1e6) / 1e6;
      count++;
    }
    if (count > 0) plates.push({ plate: p, count });
  }
  if (Math.abs(restante) > 1e-6) return { ok: false, reason: "no_armable" };
  return { ok: true, plates };
}

function formatDiscos(pesoTotal) {
  const r = calcularDiscos(pesoTotal);
  if (!r.ok) {
    return { text: r.reason === "menor_a_barra" ? "Peso menor a la barra" : "No armable con los discos configurados", error: true };
  }
  if (r.plates.length === 0) return { text: "Solo barra", error: false };
  const parts = [];
  r.plates.forEach(p => { for (let i = 0; i < p.count; i++) parts.push(p.plate); });
  return { text: parts.join(" + ") + " kg", error: false };
}

/* =========================================================================
   AUTOTEST — corre al cargar. Si algo falla, grita (banner fatal visible).
   ========================================================================= */
function runSelfTests() {
  const fails = [];
  const casos = [
    [102.5, 50, 50], [92.5, 50, 45], [137.5, 70, 95],
    [137.5, 90, 125], [137.5, 50, 70], [47.5, 50, 25]
  ];
  casos.forEach(([tm, pct, esperado]) => {
    const got = calcularPesoSerie(tm, pct);
    if (got !== esperado) fails.push(`redondeo: ${tm} * ${pct}% → ${got}, esperado ${esperado}`);
  });

  const tablaPDF = {
    squat:    { tm: 102.5, filas: [[67.5,77.5,87.5],[72.5,82.5,92.5],[77.5,87.5,97.5],[40,50,62.5]] },
    bench:    { tm: 92.5,  filas: [[60,70,77.5],[65,75,82.5],[70,77.5,87.5],[37.5,45,55]] },
    deadlift: { tm: 137.5, filas: [[90,102.5,117.5],[95,110,125],[102.5,117.5,130],[55,70,82.5]] },
    ohp:      { tm: 47.5,  filas: [[30,35,40],[32.5,37.5,42.5],[35,40,45],[20,25,27.5]] }
  };
  Object.keys(tablaPDF).forEach(key => {
    const { tm, filas } = tablaPDF[key];
    CONFIG.weeks.forEach((week, wi) => {
      week.pcts.forEach((pct, si) => {
        const got = calcularPesoSerie(tm, pct);
        const esperado = filas[wi][si];
        if (got !== esperado) fails.push(`${key} semana ${week.n} serie ${si + 1}: ${got} ≠ ${esperado} (tm ${tm}, ${pct}%)`);
      });
    });
  });

  if (fails.length) {
    const el = document.getElementById("fatal");
    el.textContent = "AUTOTEST FALLÓ — la app no es confiable hasta corregir esto:\n\n" + fails.join("\n");
    el.classList.remove("hidden");
    console.error("AUTOTEST FALLÓ", fails);
    throw new Error("Autotest de redondeo falló: " + fails.length + " casos.");
  } else {
    console.log("Autotest OK: 6 casos de empate + 48 celdas del PDF verificadas.");
  }
}

/* =========================================================================
   ESTADO / PERSISTENCIA
   ========================================================================= */
const STORAGE_KEY = "raf531_v1";

function defaultState() {
  return {
    weekIndex: 0,
    blocks: [],
    currentBlockId: null,
    history: [],
    draft: null
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  } catch (e) {
    console.error("No se pudo leer localStorage, arrancando en blanco.", e);
    return defaultState();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error("No se pudo guardar en localStorage.", e);
    alert("No se pudo guardar. El almacenamiento del navegador puede estar lleno o bloqueado.");
  }
}

// Migración no destructiva: si no hay bloques (instalación nueva o estado
// guardado con la versión anterior, sin el concepto de bloque), se crea el
// bloque semilla a partir de CONFIG y se le asigna a cualquier sesión vieja
// que no tenga blockId todavía. legacyLabel:true conserva el rótulo
// histórico "Semana 5 a 8" tal cual, sin renumerar.
function ensureBlocks(s) {
  if (s.blocks.length === 0) {
    const seed = {
      id: "block_seed",
      number: 1,
      createdAt: new Date().toISOString(),
      legacyLabel: true,
      lifts: CONFIG.dayOrder.reduce((acc, k) => { acc[k] = { ...CONFIG.lifts[k] }; return acc; }, {}),
      weeks: CONFIG.weeks.map(w => ({ ...w }))
    };
    s.blocks.push(seed);
    s.currentBlockId = seed.id;
    s.history.forEach(r => { if (!r.blockId) r.blockId = seed.id; });
  }
  if (!s.blocks.some(b => b.id === s.currentBlockId)) {
    s.currentBlockId = s.blocks[s.blocks.length - 1].id;
  }
}

let state = loadState();
ensureBlocks(state);
saveState();

function currentBlock() { return state.blocks.find(b => b.id === state.currentBlockId); }
function getBlock(id) { return state.blocks.find(b => b.id === id); }
// El bloque semilla conserva el total histórico "de 8" (dos ciclos
// encadenados del documento original); los bloques nuevos muestran su
// propio largo ("de 4").
function weekTotalLabel(block) { return block.legacyLabel ? 8 : block.weeks.length; }

/* =========================================================================
   SESIÓN — construcción de series a partir del bloque activo
   ========================================================================= */
function buildSets(block, liftKey, weekIndex) {
  const lift = block.lifts[liftKey];
  const week = block.weeks[weekIndex];
  return week.pcts.map((pct, i) => ({
    setNumber: i + 1,
    pct,
    weight: calcularPesoSerie(lift.tm, pct),
    reps: week.reps[i],
    isAmrap: week.amrap && i === week.pcts.length - 1
  }));
}

function ensureDraft(liftKey, weekIndex) {
  const block = currentBlock();
  if (state.draft && state.draft.blockId === block.id && state.draft.liftKey === liftKey && state.draft.weekIndex === weekIndex) {
    return state.draft;
  }
  const sets = buildSets(block, liftKey, weekIndex).map(s => ({
    setNumber: s.setNumber, done: false, actualReps: null, rpe: null
  }));
  state.draft = { blockId: block.id, liftKey, weekIndex, sets, note: "" };
  saveState();
  return state.draft;
}

/* =========================================================================
   TIMER DE DESCANSO
   ========================================================================= */
let restEndAt = null;
let restInterval = null;
let audioCtx = null;

function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.55);
  } catch (e) { /* audio no disponible, seguimos */ }
  if (navigator.vibrate) navigator.vibrate([250, 100, 250, 100, 250]);
}

function startRestTimer(seconds) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
  restEndAt = Date.now() + seconds * 1000;
  renderRestBar();
  if (restInterval) clearInterval(restInterval);
  restInterval = setInterval(renderRestBar, 250);
}

function stopRestTimer() {
  restEndAt = null;
  if (restInterval) clearInterval(restInterval);
  restInterval = null;
  document.getElementById("rest-bar-slot").innerHTML = "";
  document.body.classList.remove("rest-active");
}

function renderRestBar() {
  const slot = document.getElementById("rest-bar-slot");
  if (!restEndAt) { slot.innerHTML = ""; document.body.classList.remove("rest-active"); return; }
  const remainingMs = restEndAt - Date.now();
  if (remainingMs <= 0) {
    slot.innerHTML = "";
    stopRestTimer();
    beep();
    return;
  }
  // La barra es "fixed" y se suma al bottomnav: sin este padding extra tapa
  // contenido y botones cerca del final de la pantalla (detectado probando
  // en un viewport de celular real, no en el default de escritorio).
  document.body.classList.add("rest-active");
  const totalSec = Math.ceil(remainingMs / 1000);
  const mm = String(Math.floor(totalSec / 60)).padStart(2, "0");
  const ss = String(totalSec % 60).padStart(2, "0");
  slot.innerHTML = `
    <div class="rest-bar">
      <span>Descanso — ${mm}:${ss}</span>
      <button class="rest-skip" id="rest-skip-btn">Saltar</button>
    </div>`;
  document.getElementById("rest-skip-btn").onclick = stopRestTimer;
}

// dentro del bloque activo (no mezcla con bloques anteriores).
function isLiftDoneInWeek(liftKey, weekIndex) {
  const blockId = currentBlock().id;
  return state.history.some(r => r.liftKey === liftKey && r.weekIndex === weekIndex && r.blockId === blockId);
}

// Semana completa = los 3 días fijos hechos (el día 4 es opcional, no cuenta).
function isWeekCoreDone(weekIndex) {
  const block = currentBlock();

      if (field === "rpe") {

  el.querySelectorAll("[data-assist-timer]").forEach(btn => {

function finalizarSesion() {
  const draft = state.draft;
  const block = getBlock(draft.blockId) || currentBlock();
  const liftKey = draft.liftKey;
  const weekIndex = draft.weekIndex;
  const week = block.weeks[weekIndex];
  const sets = buildSets(block, liftKey, weekIndex);

  const record = {
    id: Date.now() + "_" + liftKey,
    timestamp: new Date().toISOString(),
    blockId: block.id,
    liftKey,
    weekIndex,
    weekN: week.n,
    weekLabel: week.label,
    deload: week.deload,
    note: draft.note || "",
    sets: sets.map((s, i) => ({
      setNumber: s.setNumber,
      weight: s.weight,
      reps: s.reps,
      isAmrap: s.isAmrap,
      done: draft.sets[i].done,
      actualReps: draft.sets[i].actualReps,
      rpe: draft.sets[i].rpe
    }))
  };

  state.history.unshift(record);
  state.draft = null;
  stopRestTimer();
  saveState();
  showScreen("inicio");
  renderInicio();
}

/* =========================================================================
   CIERRE DE CICLO — usa el AMRAP de la semana fuerte (5/3/1+, la anteúltima
   de cualquier bloque, sea cual sea su numeración) del bloque activo.
   ========================================================================= */
function cierreWeekIndex(block) { return block.weeks.length - 2; }

function findCierreAmrap(liftKey, block) {
  const wi = cierreWeekIndex(block);
  const rec = state.history.find(r => r.liftKey === liftKey && r.blockId === block.id && r.weekIndex === wi);
  if (!rec) return null;
  const amrapSet = rec.sets.find(s => s.isAmrap);
  if (!amrapSet || amrapSet.actualReps == null) return null;
  return { record: rec, set: amrapSet };
}

function hasCierreDataAnyLift() {
  const block = currentBlock();
  return CONFIG.dayOrder.some(k => findCierreAmrap(k, block) !== null);
}

function reglaPara(reps) {
  return CONFIG.cierreDeCiclo.reglas.find(r => reps >= r.repsMin && reps <= r.repsMax);
}

// Sugerencia por tabla de incrementos (texto corto, sin unidad).
function sugerenciaTabla(lift, reps) {
  const regla = reglaPara(reps);
  if (regla.accion === "mantener_o_bajar") return `${lift.tm} o ${redondear(lift.tm + regla.delta)}`;
  if (regla.accion === "sumar") {
    const delta = lift.category === "lower" ? regla.deltaLower : regla.deltaUpper;
    return `${redondear(lift.tm + delta)}`;
  }
  return null; // "recalcular" no tiene número de tabla, solo e1RM
}

function renderCierre() {
  const el = document.getElementById("screen-cierre");
  const block = currentBlock();
  const filas = CONFIG.dayOrder.map(liftKey => {
    const lift = block.lifts[liftKey];
    const data = findCierreAmrap(liftKey, block);
    if (!data) {
      return `
        <div class="cierre-row">
          <div class="cierre-row-top"><span class="cierre-name">${lift.label}</span></div>
          <div class="muted">Sin AMRAP registrado en la semana fuerte de este bloque.</div>
        </div>`;
    }
    const { set } = data;
    const weight = set.weight;
    const reps = set.actualReps;
    const regla = reglaPara(reps);
    const tabla = sugerenciaTabla(lift, reps);

    // e1RM literal: (peso × reps × 0.0333) + peso
    const e1rm = (weight * reps * 0.0333) + weight;
    const tmSugeridoE1rm = redondear(e1rm * 0.9);

    return `
      <div class="cierre-row">
        <div class="cierre-row-top">
          <span class="cierre-name">${lift.label}</span>
          <span class="cierre-badge">${regla.lectura}</span>
        </div>
        <div class="muted">TM actual ${lift.tm} kg · AMRAP ${weight}kg x ${reps}${set.rpe != null ? ` (RPE ${set.rpe})` : ""}</div>
        <div class="cierre-sugerencias">
          ${tabla ? `Tabla → <b>${tabla} kg</b> &nbsp;·&nbsp; ` : ""}e1RM → <b>${redondear(e1rm)} kg</b> (TM sugerido <b>${tmSugeridoE1rm} kg</b>)
        </div>
      </div>
    `;
  }).join("");

  el.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="btn-volver-cierre" style="width:auto;">← Volver</button>
    <div class="section-title" style="margin-top:14px;">Cierre de ciclo</div>
    <p class="muted">Basado en el AMRAP de la semana fuerte de este bloque.</p>
    ${filas}
    <button class="btn btn-primary" id="btn-ir-nuevo-bloque" style="margin-top:18px;">→ Armar bloque nuevo</button>
  `;
  document.getElementById("btn-volver-cierre").onclick = () => { showScreen("inicio"); renderInicio(); };
  document.getElementById("btn-ir-nuevo-bloque").onclick = () => { renderNuevoBloque(); showScreen("bloque"); };
}

/* =========================================================================
   NUEVO BLOQUE — TM editables desde la app, sin tocar CONFIG en el HTML.
   Reutiliza el esquema semanal de CONFIG.weeks (porcentajes/reps/deload),
   solo cambian los TM y la numeración (se reinicia: "Bloque N · Semana 1").
   ========================================================================= */
function renderNuevoBloque() {
  const el = document.getElementById("screen-bloque");
  const block = currentBlock();

  const filasHtml = CONFIG.dayOrder.map(liftKey => {
    const lift = block.lifts[liftKey];
    const data = findCierreAmrap(liftKey, block);
    let sugerido = lift.tm;
    let hint = "";
    if (data) {
      const { set } = data;
      const e1rm = (set.weight * set.actualReps * 0.0333) + set.weight;
      sugerido = redondear(e1rm * 0.9);
      const tabla = sugerenciaTabla(lift, set.actualReps);
      hint = tabla ? `Sugerido: ${sugerido} kg (e1RM) · Tabla: ${tabla} kg` : `Sugerido: ${sugerido} kg (e1RM)`;
    }
    return `
      <label class="tm-input-row">
        <span class="tm-input-label">${lift.label}</span>
        <input type="number" inputmode="decimal" step="2.5" min="0" data-lift-tm="${liftKey}" value="${sugerido}">
        ${hint ? `<span class="tm-input-hint">${hint}</span>` : ""}
      </label>
    `;
  }).join("");

  el.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="btn-volver-bloque" style="width:auto;">← Volver</button>
    <div class="section-title" style="margin-top:14px;">Nuevo bloque</div>
    <p class="muted">Cargá el Training Max de cada levantamiento para arrancar el Bloque ${block.number + 1}. Se precargan con la sugerencia del cierre de ciclo cuando hay datos.</p>
    ${filasHtml}
    <button class="btn btn-primary" id="btn-crear-bloque" style="margin-top:8px;">Crear bloque</button>
  `;

  document.getElementById("btn-volver-bloque").onclick = () => { showScreen("inicio"); renderInicio(); };
  document.getElementById("btn-crear-bloque").onclick = crearBloqueNuevo;
}

function crearBloqueNuevo() {
  const inputs = document.querySelectorAll("[data-lift-tm]");
  const nuevosLifts = {};
  let valido = true;
  inputs.forEach(inp => {
    const val = Number(inp.value);
    if (!Number.isFinite(val) || val <= 0) valido = false;
    nuevosLifts[inp.dataset.liftTm] = val;
  });
  if (!valido) { alert("Todos los TM tienen que ser números positivos."); return; }

  const prevBlock = currentBlock();
  const newBlock = {
    id: "block_" + Date.now(),
    number: prevBlock.number + 1,
    createdAt: new Date().toISOString(),
    legacyLabel: false,
    lifts: CONFIG.dayOrder.reduce((acc, k) => {
      acc[k] = { ...CONFIG.lifts[k], tm: nuevosLifts[k] };
      return acc;
    }, {}),
    weeks: CONFIG.weeks.map((w, i) => ({ ...w, n: i + 1 }))
  };

  state.blocks.push(newBlock);
  state.currentBlockId = newBlock.id;
  state.weekIndex = 0;
  state.draft = null;
  saveState();
  showScreen("inicio");
  renderInicio();
}

/* =========================================================================
   EXPORT / IMPORT
   ========================================================================= */
function ioButtonsHtml() {
  return `
    <div class="io-row">
      <button class="btn btn-sm" id="btn-export">Exportar JSON</button>
      <button class="btn btn-sm" id="btn-import">Importar JSON</button>
    </div>
    <input type="file" id="input-import" accept="application/json" class="hidden">
  `;
}

function wireIoButtons() {
  const exportBtn = document.getElementById("btn-export");
  const importBtn = document.getElementById("btn-import");
  const fileInput = document.getElementById("input-import");
  if (exportBtn) exportBtn.onclick = exportHistorial;
  if (importBtn) importBtn.onclick = () => fileInput.click();
  if (fileInput) fileInput.onchange = importHistorial;
}

function exportHistorial() {
  try {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const fecha = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `raf531_backup_${fecha}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    console.error(e);
    alert("No se pudo exportar el historial.");
  }
}

function importHistorial(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.history)) throw new Error("Formato inválido");
      if (!confirm(`Importar reemplazará el estado actual (${state.history.length} sesiones) por el del archivo (${parsed.history.length} sesiones). ¿Continuar?`)) return;
      state = Object.assign(defaultState(), parsed);
      ensureBlocks(state);
      saveState();
      renderInicio();
      renderHistorial();
      alert("Importado correctamente.");
    } catch (err) {
      console.error(err);
      alert("El archivo no es un backup válido de esta app.");
    }
  };
  reader.readAsText(file);
}

/* =========================================================================
   NAV / INIT
   ========================================================================= */
document.getElementById("nav-inicio").onclick = () => { renderInicio(); showScreen("inicio"); };
document.getElementById("nav-historial").onclick = () => { renderHistorial(); showScreen("historial"); };

function init() {
  runSelfTests();
  renderInicio();
  showScreen("inicio");

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(err => console.warn("SW no registrado:", err));
    });
  }
}

init();
</script>
